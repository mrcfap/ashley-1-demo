<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ashley 1.0 — Ashley e Ashen</title>
<style>
:root{font-family:system-ui,Arial;color:#eef4ff;background:#10131c}*{box-sizing:border-box}body{margin:0}.layout{display:grid;grid-template-columns:minmax(320px,480px) minmax(300px,550px);gap:25px;justify-content:center;align-items:center;min-height:100vh;padding:22px}.avatar{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:24px;border:1px solid #52637e;background:#242635;box-shadow:0 15px 65px #0008}.portrait{width:100%;height:100%;object-fit:cover;object-position:50% 25%}.avatar:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 65%,#080b17b8)}.mouth{position:absolute;left:49.9%;top:43.3%;width:8.5%;height:1%;border-radius:10% 10% 70% 70%;background:#451d21;transform:translateX(-50%) scaleY(0);transform-origin:top;opacity:0;filter:blur(.5px)}.speaking .mouth{opacity:.88;animation:talk .18s infinite alternate}@keyframes talk{from{transform:translateX(-50%) scaleY(.4)}to{transform:translateX(-50%) scaleY(4.5)}}.blink{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;opacity:0;background:linear-gradient(transparent 26%,#402d2a 30%,transparent 34%)}.blinking .blink{animation:blink .17s 1}.badge{position:absolute;z-index:2;bottom:16px;left:20px;font-weight:700;font-size:21px}.panel{background:#1b2230;border:1px solid #37475f;border-radius:22px;padding:24px}h1{margin:0 0 7px}.sub{color:#afbdd3;font-size:14px;margin:0 0 18px}.status{font-size:13px;color:#92e0b2}.messages{height:300px;overflow:auto;background:#101722;border-radius:12px;padding:12px;line-height:1.45}.message{padding:10px;margin-bottom:8px;border-radius:9px;background:#263449;white-space:pre-wrap}.message.user{background:#244a58}.row{display:flex;gap:8px;margin-top:12px;align-items:center}input,select,button{border-radius:9px;padding:12px;border:1px solid #53647d;font:inherit}input[type=text]{min-width:0;flex:1;background:#111a28;color:white}select{background:#111a28;color:white}button{background:#4778cc;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.hint{font-size:12px;color:#a9b7ca;line-height:1.5}@media(max-width:800px){.layout{grid-template-columns:1fr}.avatar{max-height:55vh;max-width:450px;margin:auto;width:100%}}
</style></head><body><main class="layout"><section id="avatar" class="avatar"><img id="portrait" class="portrait" src="static/ashley_nova.png" alt="Retrato de Ashley"><div class="mouth"></div><div class="blink"></div><div class="badge">∞ <span id="avatarName">ASHLEY</span> 1.0 <span id="state" class="status">● Pronta</span></div></section><section class="panel"><h1 id="title">Ashley 1.0</h1><p class="sub">Converse com Ashley ou Ashen.</p><label for="persona">Assistente: </label><select id="persona"><option value="Ashley">Ashley</option><option value="Ashen">Ashen</option></select><div id="messages" class="messages" aria-live="polite"><div class="message">Olá! Sou a Ashley. Pode digitar ou tocar no microfone.</div></div><form id="form" class="row"><input id="message" type="text" maxlength="4000" placeholder="Escreva sua mensagem..." required><button id="send">Enviar</button></form><div class="row"><button id="mic" type="button">🎙️ Falar</button><button id="stop" type="button">■ Parar voz</button><label><input id="audio" type="checkbox" checked> Ler respostas</label></div><p class="hint">Ashley usa voz neural gerada pelo servidor. A imagem e o movimento da boca são ilustrativos.</p></section></main>
<script src="config.js"></script><script>
const $=id=>document.getElementById(id),avatar=$('avatar');let busy=false;let currentAudio=null;let currentAudioUrl=null;const histories={Ashley:[],Ashen:[]};
function setState(t){$('state').textContent='● '+t}
function add(text,role='assistant'){const d=document.createElement('div');d.className='message '+role;d.textContent=text;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight}
setInterval(()=>{avatar.classList.add('blinking');setTimeout(()=>avatar.classList.remove('blinking'),190)},4000);

function stop(){
  if(currentAudio){
    currentAudio.pause();
    currentAudio.currentTime=0;
    currentAudio=null;
  }
  if(currentAudioUrl){
    URL.revokeObjectURL(currentAudioUrl);
    currentAudioUrl=null;
  }
  avatar.classList.remove('speaking');
  setState('Pronta');
}
$('stop').onclick=stop;

async function speak(text){
  if(!$('audio').checked)return;
  stop();
  setState('Gerando voz');
  try{
    const r=await fetch((window.ASHLEY_API_URL||'')+'/tts',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:text,persona:$('persona').value})
    });
    if(!r.ok){
      let detail='Erro ao gerar voz';
      try{const data=await r.json();detail=data.detail||detail}catch{}
      throw Error(detail);
    }
    const blob=await r.blob();
    currentAudioUrl=URL.createObjectURL(blob);
    currentAudio=new Audio(currentAudioUrl);
    currentAudio.onplay=()=>{
      avatar.classList.add('speaking');
      setState('Falando');
    };
    currentAudio.onended=()=>{
      avatar.classList.remove('speaking');
      setState('Pronta');
      if(currentAudioUrl){
        URL.revokeObjectURL(currentAudioUrl);
        currentAudioUrl=null;
      }
      currentAudio=null;
    };
    currentAudio.onerror=()=>{
      avatar.classList.remove('speaking');
      setState('Erro de voz');
    };
    await currentAudio.play();
  }catch(err){
    avatar.classList.remove('speaking');
    setState('Pronta');
    add('Voz: '+err.message);
  }
}

$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;const msg=$('message').value.trim();if(!msg)return;stop();add(msg,'user');$('message').value='';busy=true;$('send').disabled=true;setState('Pensando');try{const r=await fetch((window.ASHLEY_API_URL||'')+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,persona:$('persona').value,history:histories[$('persona').value]})});const data=await r.json();if(!r.ok)throw Error(data.detail||'Erro de conexão');add(data.answer);histories[$('persona').value].push({role:'user',content:msg},{role:'assistant',content:data.answer});histories[$('persona').value]=histories[$('persona').value].slice(-12);await speak(data.answer)}catch(err){add('Erro: '+err.message);setState('Erro')}finally{busy=false;$('send').disabled=false;if(!currentAudio||currentAudio.paused)setState('Pronta')}};

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
  const rec=new SR();
  rec.lang='pt-BR';
  rec.interimResults=false;
  rec.onstart=()=>setState('Ouvindo');
  rec.onresult=e=>{$('message').value=e.results[0][0].transcript;$('form').requestSubmit()};
  rec.onerror=e=>{add('Microfone: '+e.error);setState('Pronta')};
  rec.onend=()=>{if(!busy&&!currentAudio)setState('Pronta')};
  $('mic').onclick=()=>{stop();rec.start()}
}else{
  $('mic').disabled=true;
  $('mic').title='Reconhecimento de fala indisponível neste navegador'
}

$('portrait').onerror=()=>add('Retrato não encontrado: confira os arquivos na pasta static.');
$('persona').onchange=()=>{stop();const p=$('persona').value;$('portrait').src=p==='Ashen'?'static/ashen.png':'static/ashley_nova.png';$('portrait').alt='Retrato de '+p;$('avatarName').textContent=p.toUpperCase();$('title').textContent=p+' 1.0';add(p+' selecionado.')};
</script></body></html>
