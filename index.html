<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Ashley 1.0 — Ashley e Ashen</title>

    <style>
        :root {
            font-family: system-ui, Arial, sans-serif;
            color: #eef4ff;
            background: #10131c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(320px, 480px) minmax(300px, 550px);
            gap: 25px;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 22px;
        }

        .avatar {
            position: relative;
            aspect-ratio: 3 / 4;
            overflow: hidden;
            border-radius: 24px;
            border: 1px solid #52637e;
            background: #242635;
            box-shadow: 0 15px 65px #0008;
        }

        .portrait {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 50% 25%;
        }

        .avatar::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(
                transparent 65%,
                #080b17b8
            );
        }

        .mouth {
            position: absolute;
            left: 49.9%;
            top: 43.3%;
            width: 8.5%;
            height: 1%;
            border-radius: 10% 10% 70% 70%;
            background: #451d21;
            transform: translateX(-50%) scaleY(0);
            transform-origin: top;
            opacity: 0;
            filter: blur(0.5px);
        }

        .speaking .mouth {
            opacity: 0.88;
            animation: talk 0.18s infinite alternate;
        }

        @keyframes talk {
            from {
                transform: translateX(-50%) scaleY(0.4);
            }

            to {
                transform: translateX(-50%) scaleY(4.5);
            }
        }

        .blink {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            background: linear-gradient(
                transparent 26%,
                #402d2a 30%,
                transparent 34%
            );
        }

        .blinking .blink {
            animation: blink 0.17s 1;
        }

        @keyframes blink {
            50% {
                opacity: 0.5;
            }
        }

        .badge {
            position: absolute;
            z-index: 2;
            bottom: 16px;
            left: 20px;
            font-weight: 700;
            font-size: 21px;
        }

        .panel {
            background: #1b2230;
            border: 1px solid #37475f;
            border-radius: 22px;
            padding: 24px;
        }

        h1 {
            margin: 0 0 7px;
        }

        .sub {
            color: #afbdd3;
            font-size: 14px;
            margin: 0 0 18px;
        }

        .status {
            font-size: 13px;
            color: #92e0b2;
        }

        .messages {
            height: 300px;
            overflow: auto;
            background: #101722;
            border-radius: 12px;
            padding: 12px;
            line-height: 1.45;
        }

        .message {
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 9px;
            background: #263449;
            white-space: pre-wrap;
        }

        .message.user {
            background: #244a58;
        }

        .row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            align-items: center;
        }

        input,
        select,
        button {
            border-radius: 9px;
            padding: 12px;
            border: 1px solid #53647d;
            font: inherit;
        }

        input[type="text"] {
            min-width: 0;
            flex: 1;
            background: #111a28;
            color: white;
        }

        select {
            background: #111a28;
            color: white;
        }

        button {
            background: #4778cc;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        .hint {
            font-size: 12px;
            color: #a9b7ca;
            line-height: 1.5;
        }

        @media (max-width: 800px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .avatar {
                max-height: 55vh;
                max-width: 450px;
                margin: auto;
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="layout">

        <!-- AVATAR -->

        <section id="avatar" class="avatar">

            <img
                id="portrait"
                class="portrait"
                src="./ashley.png"
                alt="Retrato de Ashley"
            >

            <div class="mouth"></div>

            <div class="blink"></div>

            <div class="badge">
                ∞ <span id="avatarName">ASHLEY</span> 1.0

                <span id="state" class="status">
                    ● Pronta
                </span>
            </div>

        </section>


        <!-- PAINEL DE CONVERSA -->

        <section class="panel">

            <h1 id="title">Ashley 1.0</h1>

            <p class="sub">
                Converse com Ashley ou Ashen.
            </p>

            <label for="persona">
                Assistente:
            </label>

            <select id="persona">
                <option value="Ashley">Ashley</option>
                <option value="Ashen">Ashen</option>
            </select>


            <!-- MENSAGENS -->

            <div
                id="messages"
                class="messages"
                aria-live="polite"
            >
                <div class="message">
                    Olá! Sou a Ashley. Pode digitar ou tocar no microfone.
                </div>
            </div>


            <!-- CAMPO DE TEXTO -->

            <form id="form" class="row">

                <input
                    id="message"
                    type="text"
                    maxlength="4000"
                    placeholder="Escreva sua mensagem..."
                    required
                >

                <button id="send" type="submit">
                    Enviar
                </button>

            </form>


            <!-- CONTROLES DE VOZ -->

            <div class="row">

                <button id="mic" type="button">
                    🎙️ Falar
                </button>

                <button id="stop" type="button">
                    ■ Parar voz
                </button>

                <label>
                    <input
                        id="audio"
                        type="checkbox"
                        checked
                    >
                    Ler respostas
                </label>

            </div>

            <p class="hint">
                As vozes dependem das opções disponíveis no navegador.
                A imagem e o movimento da boca são ilustrativos.
            </p>

        </section>

    </main>


    <script>

        // ==========================================
        // ELEMENTOS DA INTERFACE
        // ==========================================

        const $ = id => document.getElementById(id);

        const avatar = $("avatar");

        let busy = false;


        // ==========================================
        // ESTADO DO ASSISTENTE
        // ==========================================

        function setState(texto) {
            $("state").textContent = "● " + texto;
        }


        // ==========================================
        // ADICIONAR MENSAGENS
        // ==========================================

        function add(texto, role = "assistant") {

            const div = document.createElement("div");

            div.className = "message " + role;

            div.textContent = texto;

            $("messages").appendChild(div);

            $("messages").scrollTop =
                $("messages").scrollHeight;
        }


        // ==========================================
        // ANIMAÇÃO DOS OLHOS
        // ==========================================

        setInterval(() => {

            avatar.classList.add("blinking");

            setTimeout(() => {
                avatar.classList.remove("blinking");
            }, 190);

        }, 4000);


        // ==========================================
        // PARAR A VOZ
        // ==========================================

        function stop() {

            if ("speechSynthesis" in window) {
                speechSynthesis.cancel();
            }

            avatar.classList.remove("speaking");

            setState("Pronta");
        }

        $("stop").onclick = stop;


        // ==========================================
        // SELECIONAR VOZ
        // ==========================================

        function selecionarVoz(persona) {

            if (!("speechSynthesis" in window)) {
                return null;
            }

            const vozes = speechSynthesis.getVoices();

            const vozesBR = vozes.filter(voz =>
                voz.lang.toLowerCase().replace("_", "-") === "pt-br"
            );

            if (persona === "Ashley") {

                const feminina = vozesBR.find(voz =>
                    /Francisca|Maria|Luciana|Camila|Helena|Fernanda/i
                        .test(voz.name)
                );

                return feminina || vozesBR[0] || null;
            }

            const masculina = vozesBR.find(voz =>
                /Antonio|Antônio|Daniel|Ricardo|Felipe|Paulo/i
                    .test(voz.name)
            );

            return masculina || vozesBR[0] || null;
        }


        // ==========================================
        // REPRODUZIR A VOZ
        // ==========================================

        function speak(texto) {

            if (!$("audio").checked) {
                return;
            }

            if (!("speechSynthesis" in window)) {
                return;
            }

            stop();

            const persona = $("persona").value;

            const fala = new SpeechSynthesisUtterance(texto);

            fala.lang = "pt-BR";

            const voz = selecionarVoz(persona);

            if (voz) {
                fala.voice = voz;
            }

            fala.rate = 0.95;

            if (persona === "Ashley") {
                fala.pitch = 1.15;
            } else {
                fala.pitch = 0.9;
            }

            fala.volume = 1;

            fala.onstart = () => {

                avatar.classList.add("speaking");

                setState("Falando");
            };

            fala.onend = () => {

                avatar.classList.remove("speaking");

                setState("Pronta");
            };

            fala.onerror = () => {

                avatar.classList.remove("speaking");

                setState("Pronta");
            };

            speechSynthesis.speak(fala);
        }


        // ==========================================
        // ENVIAR MENSAGENS PARA A IA
        // ==========================================

        $("form").onsubmit = async evento => {

            evento.preventDefault();

            if (busy) {
                return;
            }

            const mensagem = $("message").value.trim();

            if (!mensagem) {
                return;
            }

            stop();

            add(mensagem, "user");

            $("message").value = "";

            busy = true;

            $("send").disabled = true;

            setState("Pensando");

            try {

                const resposta = await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: mensagem,
                        persona: $("persona").value
                    })
                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    throw Error(
                        dados.detail || "Erro de conexão"
                    );
                }

                add(dados.answer);

                speak(dados.answer);

            } catch (erro) {

                add("Erro: " + erro.message);

                setState("Erro");

            } finally {

                busy = false;

                $("send").disabled = false;

                if (
                    !("speechSynthesis" in window) ||
                    !speechSynthesis.speaking
                ) {
                    setState("Pronta");
                }
            }
        };


        // ==========================================
        // MICROFONE
        // ==========================================

        const SR =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        if (SR) {

            const reconhecimento = new SR();

            reconhecimento.lang = "pt-BR";

            reconhecimento.interimResults = false;

            reconhecimento.onstart = () => {
                setState("Ouvindo");
            };

            reconhecimento.onresult = evento => {

                $("message").value =
                    evento.results[0][0].transcript;

                $("form").requestSubmit();
            };

            reconhecimento.onerror = evento => {

                add("Microfone: " + evento.error);

                setState("Pronta");
            };

            reconhecimento.onend = () => {

                if (!busy) {
                    setState("Pronta");
                }
            };

            $("mic").onclick = () => {

                stop();

                reconhecimento.start();
            };

        } else {

            $("mic").disabled = true;

            $("mic").title =
                "Reconhecimento de fala indisponível neste navegador";
        }


        // ==========================================
        // TROCAR ENTRE ASHLEY E ASHEN
        // ==========================================

        $("persona").onchange = () => {

            stop();

            const personagem = $("persona").value;

            if (personagem === "Ashen") {

                $("portrait").src = "./ashen.png";

            } else {

                $("portrait").src = "./ashley.png";
            }

            $("portrait").alt =
                "Retrato de " + personagem;

            $("avatarName").textContent =
                personagem.toUpperCase();

            $("title").textContent =
                personagem + " 1.0";

            add(personagem + " selecionado.");
        };

    </script>

</body>
</html>
